name: ACR Image Release

# 构建服务端基础镜像与应用镜像，推送至阿里云 ACR。
# - 基础镜像: 系统依赖 + Python 依赖（gha 缓存加速，依赖未变更时重建极快）
# - 应用镜像: 基于 ACR 基础镜像，仅叠加业务代码层

on:
  push:
    branches:
      - main
    paths:
      - "main/xiaozhi-server/**"
      - "Dockerfile-server"
      - "Dockerfile-server-base"
      - ".github/workflows/acr-publish.yml"
  tags:
    - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acr-server-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_IMAGE: liugangqiang/open-esp32-server

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +%Y%m%d%H%M)-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-base:
    name: Build server base image
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      base_ref: ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:base-${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME || vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD || vars.ACR_PASSWORD }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server-base
          push: true
          provenance: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:base-${{ needs.prepare.outputs.version }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:base-latest
          cache-from: type=gha,scope=server-base
          cache-to: type=gha,scope=server-base,mode=max

  build-app:
    name: Build and push application image
    runs-on: ubuntu-latest
    needs: [prepare, build-base]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME || vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD || vars.ACR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-server
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:base-${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-app
          cache-to: type=gha,scope=server-app,mode=max