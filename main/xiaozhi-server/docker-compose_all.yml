services:
  xiaozhi-esp32-server:
    build:
      context: ../..
      dockerfile: Dockerfile-server
    image: xiaozhi-esp32-server:postgres
    container_name: xiaozhi-esp32-server
    restart: always
    networks: [default]
    depends_on:
      xiaozhi-esp32-server-web:
        condition: service_started
    ports:
      - '8000:8000'
      - '8003:8003'
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./models/SenseVoiceSmall:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall
      - ./models/snakers4_silero-vad:/opt/xiaozhi-esp32-server/models/snakers4_silero-vad

  xiaozhi-esp32-server-web:
    build:
      context: ../..
      dockerfile: Dockerfile-web
    image: xiaozhi-esp32-manager-web:postgres
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks: [default]
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - '8002:8002'
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_DRUID_URL: jdbc:postgresql://xiaozhi-esp32-server-db:5432/xiaozhi_esp32_server?currentSchema=public
      SPRING_DATASOURCE_DRUID_USERNAME: xiaozhi
      SPRING_DATASOURCE_DRUID_PASSWORD: xiaozhi_esp32_password
      SPRING_DATA_REDIS_HOST: xiaozhi-esp32-server-redis
      SPRING_DATA_REDIS_PASSWORD: ''
      SPRING_DATA_REDIS_PORT: '6379'
    volumes:
      - ./uploadfile:/uploadfile

  xiaozhi-esp32-server-db:
    image: postgres:17
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xiaozhi -d xiaozhi_esp32_server']
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks: [default]
    expose:
      - 5432
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: xiaozhi
      POSTGRES_PASSWORD: xiaozhi_esp32_password
      POSTGRES_DB: xiaozhi_esp32_server

  xiaozhi-esp32-server-redis:
    image: redis:8.0
    expose:
      - 6379
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [default]

networks:
  default:
