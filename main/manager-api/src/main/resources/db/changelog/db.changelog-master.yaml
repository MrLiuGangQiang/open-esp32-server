databaseChangeLog:
  - changeSet:
      id: postgresql-baseline-schema
      author: codex
      changes:
        - sqlFile:
            encoding: utf8
            path: ../postgresql/01_schema.sql
            relativeToChangelogFile: true
            splitStatements: false
  - changeSet:
      id: postgresql-baseline-data
      author: codex
      changes:
        - sqlFile:
            encoding: utf8
            path: ../postgresql/02_data.sql
            relativeToChangelogFile: true
            splitStatements: false
